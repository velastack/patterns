name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No Node 20: vitest 5 declares `^22.12.0 || ^24.0.0 || >=26.0.0` and
        # .npmrc sets engine-strict=true, so `npm ci` itself fails on 20. The
        # package still declares node >=20 for consumers, who never install the
        # dev toolchain.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Integration case coverage
        # Registry-vs-case-table guard from the integration suite; needs no CLI.
        run: npx vitest run --config vitest.integration.config.ts integration/coverage.test.ts

      - name: Build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The CLI (and therefore the project templates) under test. Bump on purpose.
      VELA_VERSION: 0.12.2
      # Payments cases skip themselves when these are unset (e.g. fork PRs).
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
    strategy:
      fail-fast: false
      matrix:
        suite: [enable, generate, disable, stacks, lifecycle]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 for npm 11. npm 10 (bundled with Node 22) crashes with
          # "Cannot read properties of null (reading 'edgesOut')" while
          # installing a fresh `vela create` project: the optional-peer chain
          # vite -> @vitejs/devtools-vitest -> vitest@* resolves to vitest 5,
          # which conflicts with the template's vitest 4 and trips an
          # arborist bug that is only fixed in npm 11.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install vela ${{ env.VELA_VERSION }}
        run: npm install -g vela@${{ env.VELA_VERSION }}

      - name: Integration (${{ matrix.suite }})
        run: npm run test:integration -- integration/${{ matrix.suite }}.test.ts

      - name: Upload harness logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-${{ matrix.suite }}
          path: .integration-tests/**/.integration/**
          if-no-files-found: ignore
