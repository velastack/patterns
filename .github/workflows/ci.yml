name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19 is the real floor, not 20: vite 8 and vite-node 6 both declare
        # `^20.19.0 || >=22.12.0`, and .npmrc sets engine-strict=true. A bare
        # `20` resolves to whatever 20.x is latest, so it would drift past the
        # floor instead of testing it.
        node-version: ["20.19", 22, 24]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # Integration tests are skipped in CI; they run locally via `npm run test:integration`.
        run: npm test

      - name: Build
        run: npm run build
